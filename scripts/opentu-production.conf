# opentu.ai - 生产环境
# root 指向 releases/production 符号链接（由 promote 命令管理）

server {
    server_name opentu.ai;
    listen 443 ssl;
    http2 on;

    ssl_certificate /etc/letsencrypt/live/opentu.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/opentu.ai/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # 生产版本 - 通过 production 符号链接指向当前生产版本
    root /home/opentu/releases/production;
    index index.html;

    # 历史版本访问: /releases/<version>/
    location ~ ^/releases/([^/]+)(/.*)?$ {
        alias /home/opentu/releases/$1$2;
        index index.html;

        # 历史版本的 SPA fallback
        error_page 404 = @releases_fallback;
    }

    location @releases_fallback {
        if ($uri ~ ^/releases/([^/]+)) {
            set $version $1;
        }
        rewrite ^ /releases/$version/index.html last;
    }

    # sw.js 不缓存
    location = /sw.js {
        try_files /sw.js =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # 静态资源长缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|map)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    server_name opentu.ai;
    listen 80;
    return 301 https://$host$request_uri;
}
