# Host-Nginx site for the managed image beta. The static application and every
# Meimaobing account route share this one HTTPS origin so session cookies never
# need CORS or a browser-held provider key.
server {
    server_name image.truthtruth.co;
    root /opt/meimaobing-beta/image-web/current;
    index index.html;
    server_tokens off;
    client_max_body_size 25m;

    # Keep these aligned with apps/web/public/_headers. The managed account
    # endpoints deliberately have no Access-Control-Allow-Origin response.
    add_header Content-Security-Policy "upgrade-insecure-requests; default-src 'self' https: data: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com https://www.google-analytics.com https://us.i.posthog.com https://us-assets.i.posthog.com https://wiki.tu-zi.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https: wss: data:; frame-ancestors 'self' localhost:* 127.0.0.1:* *.localhost:* https://api.tu-zi.com;" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "origin-when-cross-origin" always;

    include /etc/nginx/snippets/meimaobing-image-gateway.location.conf;

    # A stale service worker can keep the old account UI alive after a release.
    location = /sw.js {
        try_files $uri =404;
        expires -1;
    }

    location = /version.json {
        try_files $uri =404;
        expires -1;
    }

    location = /precache-manifest.json {
        try_files $uri =404;
        expires -1;
    }

    location = /idle-prefetch-manifest.json {
        try_files $uri =404;
        expires -1;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        expires 365d;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/image.truthtruth.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/image.truthtruth.co/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name image.truthtruth.co;
    return 308 https://$host$request_uri;
}
