# Include this inside the TLS server block that already serves the static app
# at MEIMAOBING_IMAGE_GATEWAY_PUBLIC_ORIGIN. Do not install it before the
# private Broker image surface and this gateway have both been approved.

# Replace with MEIMAOBING_IMAGE_GATEWAY_OIDC_ISSUER. Login failures go to the
# shared account-center card, not this product's JSON API.
set $meimaobing_auth_origin https://auth.example.test;

location ^~ /auth/meimaobing/ {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Connection "";
    proxy_intercept_errors on;
    error_page 429 = @meimaobing_image_login_rate_limited;
    error_page 500 502 503 504 = @meimaobing_image_login_unavailable;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

# Browser OIDC errors belong to the unified account-center card. Keep the
# generated-image API routes below untouched: a model request is not a login
# navigation and must retain its native JSON status semantics.
location @meimaobing_image_login_rate_limited {
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    return 302 $meimaobing_auth_origin/portal/login?error=login_rate_limited;
}

location @meimaobing_image_login_unavailable {
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    return 302 $meimaobing_auth_origin/portal/login?error=login_unavailable;
}

location = /meimaobing/account {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Connection "";
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
}

location ^~ /meimaobing/v1/ {
    client_max_body_size 25m;
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}
