name: meimaobing-image-gateway

# Standalone closed-beta overlay. It joins the existing private Beta network
# but does not modify compose.core.yml or compose.application.yml.
services:
  meimaobing-image-gateway:
    profiles: [managed-images]
    image: ${MEIMAOBING_IMAGE_GATEWAY_IMAGE:?set MEIMAOBING_IMAGE_GATEWAY_IMAGE to an immutable SHA-256 image reference}
    pull_policy: never
    restart: unless-stopped
    env_file:
      - ${BETA_SECRETS_DIR:?set BETA_SECRETS_DIR}/image-gateway.env
    environment:
      NODE_ENV: production
      PORT: "8787"
      # A running disabled gateway reports only an account-service state.
      # Set true only in the coordinated Broker/Bridge/TokenHub rollout.
      MEIMAOBING_IMAGE_GATEWAY_ENABLED: ${MEIMAOBING_IMAGE_GATEWAY_ENABLED:-false}
    # If Docker DNS would resolve the OIDC issuer to a private HTTP alias,
    # add extra_hosts mapping that issuer hostname to host-gateway so
    # discovery uses public TLS. Do not bake a test hostname here.
    ports:
      - "127.0.0.1:${MEIMAOBING_IMAGE_GATEWAY_HOST_PORT:-8787}:8787"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    stop_grace_period: 20s
    networks: [beta-internal]
    mem_limit: 128m

networks:
  beta-internal:
    external: true
    name: meimaobing-beta-internal
