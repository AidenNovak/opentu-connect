name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          version: 10.21.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm --dir packages/drawnix exec vitest run src/utils/__tests__/meimaobing-account.test.ts src/utils/__tests__/managed-image-provider-profiles.test.ts src/utils/__tests__/settings-manager.test.ts src/utils/provider-settings-navigation.test.ts src/utils/gemini-api/auth.test.ts src/utils/__tests__/runtime-model-discovery.test.ts src/services/__tests__/meimaobing-same-origin-transport.test.ts src/services/__tests__/gpt-image-adapter.test.ts src/services/__tests__/image-generation-service.test.ts src/components/settings-dialog/meimaobing-account-card.test.tsx src/services/task-invocation-route.test.ts src/constants/__tests__/model-config.test.ts src/services/__tests__/meimaobing-image-gateway.test.ts
      - run: pnpm exec nx run-many -t=test --exclude=drawnix

  image-gateway:
    name: Image gateway
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test tools/meimaobing-image-gateway/server-subject.test.mjs
      - run: bash tools/meimaobing-image-gateway/deploy/verify-beta.test.sh

  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - checks
      - image-gateway
    if: always()
    steps:
      - name: Verify every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            if [[ "$result" != "success" ]]; then
              echo "A required job did not succeed." >&2
              exit 1
            fi
          done
